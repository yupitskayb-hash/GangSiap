<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GANGSIAP - Assignment Helper System</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="flex h-screen overflow-hidden bg-slate-50">

    <!-- Sidebar Navigation -->
    <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col justify-between hidden md:flex border-r border-slate-800">
        <div>
            <!-- Logo / Brand -->
            <div class="h-16 flex items-center px-6 border-b border-slate-800">
                <span class="text-xl font-bold tracking-wider text-white">GANG<span class="text-indigo-400">SIAP</span></span>
            </div>
            <!-- Nav Links -->
            <nav class="p-4 space-y-1">
                <button onclick="switchTab('dashboard')" id="nav-dashboard" class="w-full flex items-center gap-3 px-4 py-2.5 rounded-xl bg-indigo-600 text-white font-medium shadow-sm transition-all">Dashboard</button>
                <button onclick="switchTab('tasks')" id="nav-tasks" class="w-full flex items-center gap-3 px-4 py-2.5 rounded-xl hover:bg-slate-800 hover:text-white transition-colors">My Tasks</button>
                <button onclick="switchTab('collaboration')" id="nav-collaboration" class="w-full flex items-center gap-3 px-4 py-2.5 rounded-xl hover:bg-slate-800 hover:text-white transition-colors">Group Collaboration</button>
                <button onclick="switchTab('tracker')" id="nav-tracker" class="w-full flex items-center gap-3 px-4 py-2.5 rounded-xl hover:bg-slate-800 hover:text-white transition-colors">Contribution Tracker</button>
                <button onclick="switchTab('quiz')" id="nav-quiz" class="w-full flex items-center gap-3 px-4 py-2.5 rounded-xl hover:bg-slate-800 hover:text-white transition-colors">Quiz Hub</button>
            </nav>
        </div>
        <!-- User Profile Footer -->
        <div class="p-4 border-t border-slate-800 flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-indigo-500/20 text-indigo-400 flex items-center font-bold justify-center border border-indigo-500/30">AR</div>
            <div class="text-sm truncate">
                <p class="font-medium text-white">Muhamad Adam Harith</p>
                <p class="text-xs text-slate-400">D20241110851</p>
            </div>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col h-screen overflow-y-auto">
        <!-- Top Header -->
        <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-8 sticky top-0 z-10">
            <h1 id="header-title" class="text-lg font-bold text-slate-800">Assignment Dashboard</h1>
            <button onclick="openNewAssignmentModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl text-sm font-medium transition-all shadow-sm">+ New Assignment</button>
        </header>

        <!-- Dynamic View Container -->
        <div id="app-view" class="p-8 max-w-7xl mx-auto w-full space-y-6">
            <!-- Dynamically rendered via JavaScript -->
        </div>
    </main>

    <!-- New Assignment Modal -->
    <div id="assignment-modal" class="fixed inset-0 quiz-modal-backdrop hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 quiz-modal-content space-y-4 shadow-xl">
            <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                <h3 class="font-bold text-slate-900 text-lg">Add New Assignment</h3>
                <button onclick="closeNewAssignmentModal()" class="text-slate-400 hover:text-slate-600">&times;</button>
            </div>
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Course & Title</label>
                    <input type="text" id="modal-title" placeholder="e.g., DEP3043 - Software Architecture" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Deadline</label>
                    <input type="date" id="modal-deadline" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Initial Subtask</label>
                    <input type="text" id="modal-subtask" placeholder="e.g., Subtask 1: Initial System Requirements" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
            </div>
            <div class="flex justify-end gap-3 pt-2">
                <button onclick="closeNewAssignmentModal()" class="px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-xl">Cancel</button>
                <button onclick="saveNewAssignment()" class="px-4 py-2 text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 rounded-xl shadow-sm">Save Assignment</button>
            </div>
        </div>
    </div>

    <!-- Application Logic Script -->
    <script>
        // Initial Mock Data or LocalStorage Sync
        let currentTab = 'dashboard';
        let assignments = JSON.parse(localStorage.getItem('gangsiap_assignments')) || [
            {
                id: 1,
                title: 'DEP3043 - Reka Bentuk Dalam Pembangunan Koswer',
                deadline: '2026-12-15',
                type: 'Group Project',
                status: 'In Progress',
                subtasks: [
                    { id: 101, title: 'Subtask 2.1: Instructional Design Model (ADDIE) Architecture', assignee: 'Muhamad Adam Harith', completed: false },
                    { id: 102, title: 'Subtask 2.2: Database Schema & Entity Modeling', assignee: 'Muhammad Aqil Aiman', completed: true },
                    { id: 103, title: 'Subtask 2.3: Formative Quiz Checkpoint Module Integration', assignee: 'Muhamad Luqman Hakim', completed: false }
                ]
            }
        ];

        function saveData() {
            localStorage.setItem('gangsiap_assignments', JSON.stringify(assignments));
        }

        function switchTab(tab) {
            currentTab = tab;
            // Update active state on sidebar buttons
            document.querySelectorAll('aside nav button').forEach(btn => {
                btn.className = "w-full flex items-center gap-3 px-4 py-2.5 rounded-xl hover:bg-slate-800 hover:text-white transition-colors text-slate-300";
            });
            const activeBtn = document.getElementById(`nav-${tab}`);
            if(activeBtn) {
                activeBtn.className = "w-full flex items-center gap-3 px-4 py-2.5 rounded-xl bg-indigo-600 text-white font-medium shadow-sm transition-all";
            }
            renderView();
        }

        function calculateOverallProgress() {
            let total = 0;
            let completed = 0;
            assignments.forEach(a => {
                a.subtasks.forEach(s => {
                    total++;
                    if(s.completed) completed++;
                });
            });
            return total === 0 ? 0 : Math.round((completed / total) * 100);
        }

        function renderView() {
            const container = document.getElementById('app-view');
            const headerTitle = document.getElementById('header-title');

            if (currentTab === 'dashboard') {
                headerTitle.innerText = "Assignment Dashboard";
                const progress = calculateOverallProgress();
                container.innerHTML = `
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="gangsiap-card p-6">
                            <p class="text-sm font-medium text-slate-500">Active Coursework</p>
                            <p class="text-3xl font-bold text-slate-900 mt-2">${assignments.length} Tasks</p>
                            <p class="text-xs text-emerald-600 font-medium mt-1">↑ On track for deadlines</p>
                        </div>
                        <div class="gangsiap-card p-6">
                            <p class="text-sm font-medium text-slate-500">Overall Progress</p>
                            <p class="text-3xl font-bold text-slate-900 mt-2">${progress}%</p>
                            <div class="w-full bg-slate-100 h-2 rounded-full mt-3 overflow-hidden">
                                <div class="bg-indigo-600 h-full rounded-full progress-bar-fill" style="width: ${progress}%;"></div>
                            </div>
                        </div>
                        <div class="gangsiap-card p-6">
                            <p class="text-sm font-medium text-slate-500">Formative Quiz Score Avg</p>
                            <p class="text-3xl font-bold text-slate-900 mt-2">85%</p>
                            <p class="text-xs text-indigo-600 font-medium mt-1">Ready for milestone lock-in</p>
                        </div>
                    </div>

                    <div class="space-y-4">
                        <h2 class="text-md font-bold text-slate-900">Active Coursework Milestones</h2>
                        ${assignments.map(a => renderAssignmentCard(a)).join('')}
                    </div>
                `;
            } else if (currentTab === 'tasks') {
                headerTitle.innerText = "My Tasks & Subtask Manager";
                container.innerHTML = `
                    <div class="flex justify-between items-center mb-4">
                        <p class="text-sm text-slate-500">Manage individual and group assignments, check off subtasks, and track progress.</p>
                        <button onclick="openNewAssignmentModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 rounded-lg text-xs font-semibold">+ Add Task</button>
                    </div>
                    <div class="space-y-4">
                        ${assignments.map(a => renderAssignmentCard(a, true)).join('')}
                    </div>
                `;
            } else if (currentTab === 'collaboration') {
                headerTitle.innerText = "Group Collaboration";
                container.innerHTML = `<div class="gangsiap-card p-8 text-center text-slate-500">Group comment threads and task assignment delegation modules active.</div>`;
            } else if (currentTab === 'tracker') {
                headerTitle.innerText = "Contribution Tracker";
                container.innerHTML = `<div class="gangsiap-card p-8 text-center text-slate-500">Workload distribution and member activity logs active.</div>`;
            } else if (currentTab === 'quiz') {
                headerTitle.innerText = "Quiz Hub & Formative Checkpoints";
                container.innerHTML = `<div class="gangsiap-card p-8 text-center text-slate-500">Task-linked quizzes, automated scores, and answer rationales active.</div>`;
            }
        }

        function renderAssignmentCard(assignment, showSubtaskAdder = false) {
            return `
                <div class="gangsiap-card p-6 space-y-4">
                    <div class="flex items-center justify-between border-b border-slate-100 pb-4">
                        <div>
                            <h2 class="font-bold text-slate-900">${assignment.title}</h2>
                            <p class="text-xs text-slate-500">Deadline: ${assignment.deadline} • ${assignment.type}</p>
                        </div>
                        <span class="badge-in-progress">${assignment.status}</span>
                    </div>

                    <div class="space-y-2">
                        ${assignment.subtasks.map(sub => `
                            <div class="flex items-center justify-between p-3 bg-slate-50 rounded-xl border border-slate-200">
                                <div class="flex items-center gap-3">
                                    <input type="checkbox" ${sub.completed ? 'checked' : ''} onclick="toggleSubtask(${assignment.id}, ${sub.id})" class="w-4 h-4 rounded text-indigo-600 focus:ring-indigo-500 cursor-pointer">
                                    <div>
                                        <p class="text-sm font-medium ${sub.completed ? 'line-through text-slate-400' : 'text-slate-800'}">${sub.title}</p>
                                        <p class="text-xs text-slate-500">Assigned to: ${sub.assignee}</p>
                                    </div>
                                </div>
                                <button onclick="triggerQuizPrompt('${sub.title}')" class="bg-amber-50 hover:bg-amber-100 text-amber-700 border border-amber-200 px-3 py-1.5 rounded-lg text-xs font-semibold transition-all flex items-center gap-1.5">
                                    ⚡ Take Quiz Checkpoint
                                </button>
                            </div>
                        `).join('')}
                    </div>

                    ${showSubtaskAdder ? `
                        <div class="pt-2 flex gap-2">
                            <input type="text" id="new-sub-${assignment.id}" placeholder="Add new subtask..." class="flex-1 px-3 py-1.5 border border-slate-200 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            <button onclick="addSubtask(${assignment.id})" class="bg-slate-900 hover:bg-slate-800 text-white px-3 py-1.5 rounded-lg text-xs font-medium">Add Subtask</button>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function toggleSubtask(assignmentId, subtaskId) {
            const assignment = assignments.find(a => a.id === assignmentId);
            if(assignment) {
                const sub = assignment.subtasks.find(s => s.id === subtaskId);
                if(sub) {
                    sub.completed = !sub.completed;
                    saveData();
                    renderView();
                }
            }
        }

        function addSubtask(assignmentId) {
            const input = document.getElementById(`new-sub-${assignmentId}`);
            if(input && input.value.trim() !== '') {
                const assignment = assignments.find(a => a.id === assignmentId);
                if(assignment) {
                    assignment.subtasks.push({
                        id: Date.now(),
                        title: input.value.trim(),
                        assignee: 'Muhamad Adam Harith',
                        completed: false
                    });
                    saveData();
                    renderView();
                }
            }
        }

        function openNewAssignmentModal() {
            document.getElementById('assignment-modal').classList.remove('hidden');
        }

        function closeNewAssignmentModal() {
            document.getElementById('assignment-modal').classList.add('hidden');
        }

        function saveNewAssignment() {
            const title = document.getElementById('modal-title').value.trim();
            const deadline = document.getElementById('modal-deadline').value;
            const subtaskTitle = document.getElementById('modal-subtask').value.trim();

            if(!title || !deadline) {
                alert('Please enter a title and deadline.');
                return;
            }

            assignments.push({
                id: Date.now(),
                title: title,
                deadline: deadline,
                type: 'Individual/Group',
                status: 'In Progress',
                subtasks: subtaskTitle ? [{ id: Date.now() + 1, title: subtaskTitle, assignee: 'Muhamad Adam Harith', completed: false }] : []
            });

            saveData();
            closeNewAssignmentModal();
            renderView();
        }

        function triggerQuizPrompt(subtaskTitle) {
            alert(`Opening Formative Quiz Checkpoint for:\n"${subtaskTitle}"\n\n(This will trigger the interactive quiz modal module!)`);
        }

        // Initial render on page load
        renderView();
    </script>
</body>
</html>
